<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1c2530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="三线课表">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>三线课表</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1c2530; --muted:#6e7d91; --faint:#97a4b5;
  --line:#e6eaf0; --panel:#f7f9fc; --bg:#ffffff;
  --blue:#2d6cdf; --orange:#e47d31; --green:#289a6a; --red:#ce4242;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.htitle{font-size:19px;font-weight:700;letter-spacing:.3px}
.hsub{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:var(--panel);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
main{padding:14px 14px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.now{border:0;background:var(--ink);color:#fff;border-radius:16px;padding:16px 16px 14px;margin-bottom:14px}
.now .lab{font-size:12px;opacity:.6;letter-spacing:1px}
.now .t{font-size:22px;font-weight:700;margin-top:4px}
.now .m{font-size:13px;opacity:.66;margin-top:6px}
.now .go{display:inline-block;margin-top:12px;background:#fff;color:var(--ink);font-weight:700;
  font-size:14px;padding:9px 16px;border-radius:99px}
.item{display:flex;gap:12px;align-items:center;padding:13px 14px}
.item+.item{border-top:1px solid var(--line)}
.dot{width:4px;align-self:stretch;border-radius:99px;flex:0 0 4px;margin:-3px 0}
.tt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 84px}
.tn{font-size:16px;font-weight:600;line-height:1.3}
.ts{font-size:12px;color:var(--faint);margin-top:3px}
.chk{flex:0 0 34px;height:34px;border-radius:99px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:transparent}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.item.done .tn{color:var(--faint);text-decoration:line-through}
.h2{font-size:13px;font-weight:700;color:var(--faint);letter-spacing:1px;margin:18px 4px 8px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs div{flex:1;text-align:center;padding:11px 0 12px;font-size:11px;color:var(--faint)}
.tabs div b{display:block;font-size:19px;font-weight:400;line-height:1.2;margin-bottom:2px}
.tabs div.on{color:var(--ink)}
/* 课表 */
.grid{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.ghead{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
.ghead .hc{flex:1;text-align:center;font-size:12px;color:var(--muted);padding:9px 0 8px}
.ghead .hc.today{color:var(--ink);font-weight:700;background:#eef3fd}
.gbody{display:flex;position:relative}
.hcol{flex:0 0 34px;position:relative}
.hcol span{position:absolute;right:6px;font-size:10px;color:var(--faint);
  transform:translateY(-50%);font-variant-numeric:tabular-nums}
.dcol{flex:1;position:relative;border-left:1px solid #f2f5f9}
.dcol.today{background:#fafcff}
.hline{position:absolute;left:0;right:0;border-top:1px solid #f2f5f9}
.blk{position:absolute;left:2px;right:2px;border-radius:8px;padding:4px 6px;overflow:hidden;
  color:#fff;font-size:11px;line-height:1.25;font-weight:600}
.blk small{display:block;font-weight:400;opacity:.85;font-size:10px;margin-top:1px}
.blk.done{opacity:.45}
.fab{position:fixed;right:calc(50% - 280px + 18px);bottom:calc(88px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:99px;background:var(--ink);color:#fff;border:0;
  font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(28,37,48,.28);z-index:25}
@media(max-width:590px){.fab{right:18px}}
/* 打卡 */
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--panel);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.heat i{padding-bottom:100%;border-radius:4px;background:var(--panel)}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0}
.row+.row{border-top:1px solid var(--line)}
.row .k{font-size:15px}
.row .v{font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:#fff;font-size:15px;font-weight:600;color:var(--ink);margin-top:10px;text-align:center}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--red)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 编辑面板 */
.sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(20,26,34,.42)}
.sheet.on{display:block}
.sheet .box{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
  animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.f input,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
.f .two{display:flex;gap:8px}
.days{display:flex;gap:6px}
.days button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:13px;color:var(--muted)}
.days button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:rgba(28,37,48,.95);color:#fff;font-size:14px;padding:11px 18px;border-radius:99px;z-index:80;
  opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.hint{font-size:12px;color:var(--faint);line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div>
        <div class="htitle" id="hTitle">今天</div>
        <div class="hsub" id="hSub"></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:13px;color:var(--muted)">今日</div>
        <div style="font-size:19px;font-weight:700" id="hProg">0/0</div>
      </div>
    </div>
    <div class="bar"><i id="hBar" style="width:0%"></i></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <div data-v="today" class="on"><b>✓</b>今日</div>
  <div data-v="week"><b>▦</b>课表</div>
  <div data-v="stats"><b>◲</b>打卡</div>
  <div data-v="set"><b>⚙</b>设置</div>
</nav>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ---------- 常量 ---------- */
var KEY='kebiao.v1';
var TRACK={
  kaoyan:{name:'考研',color:'#2d6cdf'},
  cet:   {name:'六级',color:'#e47d31'},
  money: {name:'变现',color:'#289a6a'},
  meta:  {name:'复盘',color:'#8b98a8'},
  life:  {name:'生活',color:'#0e8f8f'}
};
var DOW=['一','二','三','四','五','六','日'];
var H0=8, H1=23, HH=46;   /* 课表显示 8:00–23:00，每小时 46px */

/* ---------- 数据 ---------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function seed(){
  var s=[
    /* 约会日（三/六/日）什么都不排，只留约会那一条 */

    /* 一/二/四/五：上午数学整块，下午六级模块，18–19 健身，19:30 第二块，21:00 单词 */
    ['数学 · 高数一轮','kaoyan',[1,2,4,5],'09:30','11:30','2 小时整块：复习昨天 → 新内容 → 20 道限时题'],
    ['六级 · 听力','cet',[1],'14:00','16:00','1 套真题精听 + 跟读 20 分钟'],
    ['六级 · 阅读','cet',[2],'14:00','16:00','2 篇真题 + 长难句 3 句'],
    ['六级 · 写译','cet',[4],'14:00','16:00','翻译 1 段；双周加 1 篇作文'],
    ['六级 · 整套计时','cet',[5],'14:00','16:10','整套真题卡时间，做完只对答案不复盘'],

    ['六级 · 词汇长难句','cet',[1],'19:30','20:50','从真题里捞词 + 拆 10 句长难句'],
    ['817 · 教材第一遍','kaoyan',[2],'19:30','20:50','《工程材料科学与设计》1 章：读 + 手写知识树，不抄书'],
    ['变现 · 整块','money',[4],'19:30','20:50','只做一件：发布 / 找客户 / 改产品'],
    ['六级 · 整套复盘','cet',[5],'19:30','20:50','精听错题段 + 写错因，不重做整套'],

    ['单词 · 六级','cet',[1,2,4,5],'21:00','21:40','新词 40 个 + 昨天错词复现'],
    ['周复盘','meta',[5],'21:45','22:15','看本周打卡 → 定下周唯一必做'],

    /* 固定时间：不打卡、不计入完成率，只是占住这段时间 */
    ['健身','life',[1,2,4,5],'18:00','19:00','健身房，不许被学习挤掉', true],
    ['约会','life',[3,6,7],'13:00','21:00','约会日只约会，不排任何学习', true]
  ];
  return s.map(function(x){
    return {id:uid(),title:x[0],track:x[1],days:x[2],start:x[3],end:x[4],note:x[5],fixed:!!x[6]};
  });
}
var S = load();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d && d.blocks && d.blocks.length){
        d.checkins=d.checkins||{}; d.settings=d.settings||{notify:true,lead:0,sound:true};
        /* v3 → v4：约会日清空，学习只压在一/二/四/五（打卡记录保留） */
        if(!d.version || d.version<4){ d.blocks=seed(); d.version=4; }
        return d;
      }
    }
  }catch(e){}
  return {version:4, blocks:seed(), checkins:{}, settings:{notify:true,lead:0,sound:true}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('存储失败，可能空间满了'); } }

/* ---------- 时间工具 ---------- */
function pad(n){ return n<10?'0'+n:''+n; }
function iso(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dow(d){ d=d||new Date(); var w=d.getDay(); return w===0?7:w; }
function toMin(t){ var a=t.split(':'); return (+a[0])*60+(+a[1]); }
function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function hm(m){ return pad(Math.floor(m/60))+':'+pad(m%60); }
function fmt(m){ return hm(m); }

/* ---------- 查询 ---------- */
function blocksOn(d){
  var w=dow(d);
  return S.blocks.filter(function(b){ return b.days.indexOf(w)>=0; })
                .sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
}
/* 要打卡的任务：固定日程（健身/约会）不算 */
function tasksOn(d){ return blocksOn(d).filter(function(b){ return !b.fixed; }); }
function ckKey(d,b){ return iso(d)+'|'+b.id+'|'+b.start; }
function isDone(d,b){ return !!S.checkins[ckKey(d,b)]; }

/* ---------- 视图 ---------- */
var view='today';
function render(){
  var m=document.getElementById('view');
  if(view==='today') m.innerHTML=viewToday();
  else if(view==='week') m.innerHTML=viewWeek();
  else if(view==='stats') m.innerHTML=viewStats();
  else m.innerHTML=viewSet();
  paintHeader();
  bind();
  window.scrollTo(0,currentScroll);
}
var currentScroll=0;

function paintHeader(){
  var d=new Date();
  var list=tasksOn(d);
  var done=list.filter(function(b){ return isDone(d,b); }).length;
  document.getElementById('hTitle').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+DOW[dow(d)-1];
  document.getElementById('hSub').textContent=view==='today'?'点圈打卡 · 点条目改时间':
    (view==='week'?'点方块修改 · 右下角加一节':(view==='stats'?'连续与完成率':'到点提醒与数据'));
  document.getElementById('hProg').textContent=done+'/'+list.length;
  document.getElementById('hBar').style.width=(list.length?done/list.length*100:0)+'%';
}

function viewToday(){
  var d=new Date(), list=blocksOn(d), n=nowMin();
  var cur=null, nxt=null;
  list.forEach(function(b){
    if(toMin(b.start)<=n && n<toMin(b.end)) cur=b;
    else if(toMin(b.start)>n && !nxt) nxt=b;
  });
  var html='';
  if(list.length===0){
    html+='<div class="card" style="text-align:center;color:var(--muted);padding:26px 14px">'+
          '今天没有排课。休息，或者去「课表」加一节。</div>';
  }
  if(cur){
    html+='<div class="now"><div class="lab">现在</div><div class="t">'+esc(cur.title)+
      '　'+cur.start+'–'+cur.end+'</div><div class="m">'+esc(cur.note||'')+'</div>'+
      '<a class="go" href="javascript:" data-do="'+cur.id+'">'+
      (isDone(d,cur)?'已打卡 ✓':'打　卡')+'</a></div>';
  }else if(nxt){
    html+='<div class="now"><div class="lab">接下来</div><div class="t">'+esc(nxt.title)+
      '　'+nxt.start+'–'+nxt.end+'</div><div class="m">还有 '+(toMin(nxt.start)-n)+' 分钟</div></div>';
  }
  if(list.length){
    html+='<div class="h2">今日清单</div><div class="card" style="padding:0">';
    list.forEach(function(b){
      if(b.fixed){
        html+='<div class="item" style="opacity:.72" data-edit="'+b.id+'">'+
          '<div class="dot" style="background:'+TRACK[b.track].color+'"></div>'+
          '<div class="tt">'+b.start+'–'+b.end+'</div>'+
          '<div style="flex:1;min-width:0">'+
            '<div class="tn">'+esc(b.title)+'</div>'+
            '<div class="ts">固定 · '+esc(b.note||'')+'</div>'+
          '</div>'+
          '<div style="width:26px;height:26px;border-radius:99px;border:1px dashed var(--muted);'+
          'color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center">固</div></div>';
        return;
      }
      var dn=isDone(d,b), late=(toMin(b.end)<n)&&!dn;
      html+='<div class="item'+(dn?' done':'')+'" data-edit="'+b.id+'">'+
        '<div class="dot" style="background:'+TRACK[b.track].color+'"></div>'+
        '<div class="tt">'+b.start+'–'+b.end+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div class="tn">'+esc(b.title)+'</div>'+
          '<div class="ts">'+TRACK[b.track].name+(b.note?' · '+esc(b.note):'')+(late?' · 已过点':'')+'</div>'+
        '</div>'+
        '<div class="chk'+(dn?' on':'')+'" data-do="'+b.id+'">✓</div></div>';
    });
    html+='</div>';
  }
  var tasks=tasksOn(d);
  var done=tasks.filter(function(b){ return isDone(d,b); }).length;
  var wp=weekPlan(), rows='';
  Object.keys(TRACK).forEach(function(k){
    if(!wp[k].plan) return;
    rows+='<div class="row"><div class="k"><span style="display:inline-block;width:8px;height:8px;'+
      'border-radius:99px;background:'+TRACK[k].color+';margin-right:8px"></span>'+TRACK[k].name+
      '</div><div class="v">'+(wp[k].done?(wp[k].done/60).toFixed(1)+' / ':'')+(wp[k].plan/60).toFixed(1)+' h</div></div>';
  });
  html+='<div class="h2">本周投入</div><div class="card">'+rows+
        '<div class="hint" style="margin-top:6px">斜杠左边是已经打卡的小时数。现在这个阶段只排了数学 / 817 / 六级 / 变现——政治 9 月才开，英语二和六级共用一条跑道。</div></div>';
  var lg=Object.keys(TRACK).map(function(k){
    return '<span style="color:'+TRACK[k].color+'">'+TRACK[k].name+'</span>';
  }).join(' / ');
  html+='<div class="hint">今日完成 '+done+'/'+tasks.length+'　·　颜色：'+lg+'</div>';
  return html;
}

/* 当前这一周（周一到周日）各条线的计划分钟数 / 已打卡分钟数 */
function weekPlan(){
  var d=new Date(), mon=new Date(d);
  mon.setDate(mon.getDate()-(dow(d)-1));
  var res={};
  Object.keys(TRACK).forEach(function(k){ res[k]={plan:0,done:0}; });
  for(var i=0;i<7;i++){
    var dd=new Date(mon); dd.setDate(dd.getDate()+i);
    blocksOn(dd).forEach(function(b){
      if(b.fixed) return;
      var m=toMin(b.end)-toMin(b.start);
      res[b.track].plan+=m;
      if(isDone(dd,b)) res[b.track].done+=m;
    });
  }
  return res;
}

function viewWeek(){
  var d=new Date(), todayD=dow(d);
  var hours=[];
  for(var h=H0;h<=H1;h++) hours.push(h);
  var html='<div class="grid"><div class="ghead"><div class="hc" style="flex:0 0 34px"></div>';
  for(var i=1;i<=7;i++) html+='<div class="hc'+(i===todayD?' today':'')+'">'+DOW[i-1]+'</div>';
  html+='</div><div class="gbody"><div class="hcol" style="height:'+(hours.length*HH)+'px">';
  hours.forEach(function(h){ html+='<span style="top:'+((h-H0)*HH)+'px">'+pad(h)+'</span>'; });
  html+='</div>';
  for(var w=1;w<=7;w++){
    html+='<div class="dcol'+(w===todayD?' today':'')+'" style="height:'+(hours.length*HH)+'px">';
    hours.forEach(function(h){
      html+='<div class="hline" style="top:'+((h-H0)*HH)+'px"></div>';
    });
    S.blocks.filter(function(b){ return b.days.indexOf(w)>=0; }).forEach(function(b){
      var s=toMin(b.start), e=toMin(b.end);
      var top=(s-H0*60)/60*HH, hgt=Math.max(20,(e-s)/60*HH-2);
      var done=w===todayD && isDone(d,b);
      html+='<div class="blk'+(done?' done':'')+'" data-edit="'+b.id+'" style="top:'+top+'px;height:'+hgt+
        'px;background:'+TRACK[b.track].color+(b.fixed?';opacity:.55':'')+'">'+esc(b.title)+
        '<small>'+b.start+'</small></div>';
    });
    html+='</div>';
  }
  html+='</div></div><div class="hint">左右不用滑，7 天都在一屏里；点色块改内容、改时间。</div>';
  html+='<button class="fab" id="fab">+</button>';
  return html;
}

function viewStats(){
  var d=new Date();
  var streak=0, probe=new Date(d);
  for(var i=0;i<400;i++){
    var any=Object.keys(S.checkins).some(function(k){ return k.indexOf(iso(probe)+'|')===0; });
    if(any){ streak++; probe.setDate(probe.getDate()-1); }
    else { if(i>0) break; else { probe.setDate(probe.getDate()-1); } }
  }
  var week=0, total=0;
  for(var j=0;j<7;j++){
    var dd=new Date(d); dd.setDate(dd.getDate()-j);
    var l=tasksOn(dd); total+=l.length;
    week+=l.filter(function(b){ return isDone(dd,b); }).length;
  }
  var counts={};
  Object.keys(TRACK).forEach(function(k){ counts[k]=0; });
  Object.keys(S.checkins).forEach(function(k){
    var id=k.split('|')[1];
    var b=S.blocks.filter(function(x){ return x.id===id; })[0];
    if(b) counts[b.track]++;
  });
  var html='<div class="stats">'+
    '<div class="stat"><b>'+streak+'</b><span>连续打卡（天）</span></div>'+
    '<div class="stat"><b>'+(total?Math.round(week/total*100):0)+'%</b><span>近 7 天完成率</span></div>'+
    '<div class="stat"><b>'+Object.keys(S.checkins).length+'</b><span>累计打卡</span></div>'+
    '</div>';
  html+='<div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:10px">近 8 周</div>'+
        heatmap()+'</div>';
  html+='<div class="card">';
  Object.keys(TRACK).forEach(function(k){
    html+='<div class="row"><div class="k"><span style="display:inline-block;width:8px;height:8px;'+
      'border-radius:99px;background:'+TRACK[k].color+';margin-right:8px"></span>'+
      TRACK[k].name+'</div><div class="v">'+counts[k]+' 次</div></div>';
  });
  html+='</div>';
  html+='<div class="hint">连续打卡＝往前数，每天至少打 1 个勾就算。</div>';
  return html;
}

function heatmap(){
  var cells=[], d=new Date();
  d.setDate(d.getDate()-((dow(d)-1)+7*7));
  for(var i=0;i<56;i++){
    var n=0;
    Object.keys(S.checkins).forEach(function(k){ if(k.indexOf(iso(d)+'|')===0) n++; });
    var c=n===0?'#f2f5f9':(n===1?'#bfe3d2':(n===2?'#6ec49f':'#289a6a'));
    cells.push('<i style="background:'+c+'" title="'+iso(d)+' '+n+'"></i>');
    d.setDate(d.getDate()+1);
  }
  return '<div class="heat">'+cells.join('')+'</div>';
}

function viewSet(){
  var perm=(typeof Notification!=='undefined')?Notification.permission:'none';
  var sup=(typeof Notification!=='undefined');
  var html='';
  html+='<div class="card">';
  html+='<div class="row"><div class="k">到点提醒</div><div class="v">'+
    (S.settings.notify?'开':'关')+'</div></div>';
  html+='<div class="row"><div class="k">系统通知权限</div><div class="v">'+
    (sup?(perm==='granted'?'已允许':(perm==='denied'?'已拒绝（要去系统设置里开）':'未申请')):'此浏览器不支持')+
    '</div></div>';
  html+='<div class="two" style="display:flex;gap:8px">'+
    '<button class="btn" data-act="perm">申请通知权限</button>'+
    '<button class="btn" data-act="toggleNotify">'+(S.settings.notify?'关掉提醒':'打开提醒')+'</button>'+
    '</div>';
  html+='<div class="hint">'+
    '① App 开着（含切后台一小会儿）时，到点会弹通知 + 响一声 + 震动。<br>'+
    '② 想「关掉浏览器也响」，把下面导出的 .ics 导进手机日历，让系统日历去提醒——这是唯一不依赖 App 在线的办法。'+
    '</div>';
  html+='</div>';

  html+='<div class="card">';
  html+='<button class="btn primary" data-act="ics">导出日历文件（.ics，可导入手机日历）</button>';
  html+='<button class="btn" data-act="exportJson">导出打卡备份（.json）</button>';
  html+='<button class="btn" data-act="importJson">导入备份</button>';
  html+='<input type="file" id="fileIn" accept=".json" style="display:none">';
  html+='<button class="btn danger" data-act="reset">清空打卡记录</button>';
  html+='</div>';

  html+='<div class="card">';
  html+='<div class="row"><div class="k">数据存在哪</div><div class="v">本机浏览器</div></div>';
  html+='<div class="row"><div class="k">课节数</div><div class="v">'+S.blocks.length+'</div></div>';
  html+='<div class="hint">换手机、清浏览器数据都会丢。每周日顺手点一次「导出备份」。</div>';
  html+='</div>';
  return html;
}

/* ---------- 交互 ---------- */
function bind(){
  var m=document.getElementById('view');
  m.querySelectorAll('[data-do]').forEach(function(el){
    el.onclick=function(ev){ ev.stopPropagation(); toggle(el.getAttribute('data-do')); };
  });
  m.querySelectorAll('[data-edit]').forEach(function(el){
    el.onclick=function(ev){
      if(ev.target.hasAttribute('data-do')) return;
      var b=S.blocks.filter(function(x){ return x.id===el.getAttribute('data-edit'); })[0];
      if(b) editBlock(b);
    };
  });
  m.querySelectorAll('[data-act]').forEach(function(el){
    el.onclick=function(){ act(el.getAttribute('data-act')); };
  });
  var fab=document.getElementById('fab');
  if(fab) fab.onclick=function(){ editBlock(null); };
}

function act(a){
  if(a==='perm'){
    if(typeof Notification==='undefined'){ toast('这个浏览器不支持通知'); return; }
    Notification.requestPermission().then(function(p){
      toast(p==='granted'?'通知已开启':'没给权限，只能弹应用内提示');
      render();
    });
  }
  if(a==='toggleNotify'){ S.settings.notify=!S.settings.notify; save(); render(); }
  if(a==='ics') downloadICS();
  if(a==='exportJson'){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    download(blob,'三线课表备份-'+iso()+'.json');
  }
  if(a==='importJson'){ document.getElementById('fileIn').click(); }
  if(a==='reset'){
    if(confirm('只清打卡记录，课表保留。确定？')){ S.checkins={}; save(); render(); toast('已清空'); }
  }
}

document.addEventListener('change',function(e){
  if(e.target && e.target.id==='fileIn'){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d.blocks) throw 0;
        S=d; save(); render(); toast('导入成功');
      }catch(err){ toast('文件不对，导入失败'); }
    };
    r.readAsText(f);
  }
});

function toggle(id){
  var d=new Date();
  var b=S.blocks.filter(function(x){ return x.id===id; })[0];
  if(!b) return;
  var k=ckKey(d,b);
  if(S.checkins[k]) delete S.checkins[k];
  else { S.checkins[k]=Date.now(); beep(); if(navigator.vibrate) navigator.vibrate(18); }
  save(); render();
}

/* ---------- 编辑面板 ---------- */
var editing=null;
function editBlock(b){
  editing=b?JSON.parse(JSON.stringify(b)):{id:null,title:'',track:'kaoyan',days:[dow()],start:'20:00',end:'21:00',note:''};
  var box=document.getElementById('sheetBox');
  var days='';
  for(var i=1;i<=7;i++){
    days+='<button data-day="'+i+'"'+(editing.days.indexOf(i)>=0?' class="on"':'')+'>'+DOW[i-1]+'</button>';
  }
  var tr='';
  Object.keys(TRACK).forEach(function(k){
    tr+='<button data-tr="'+k+'"'+(editing.track===k?' class="on"':'')+
      ' style="'+(editing.track===k?'background:'+TRACK[k].color+';border-color:'+TRACK[k].color:'')+'">'+
      TRACK[k].name+'</button>';
  });
  box.innerHTML=
    '<div style="font-size:17px;font-weight:700;margin:2px 0 14px">'+(b?'改这一节':'加一节')+'</div>'+
    '<div class="f"><label>做什么</label><input id="eTitle" value="'+esc(editing.title)+'" placeholder="例如：数学"></div>'+
    '<div class="f"><label>属于哪条线</label><div class="seg" id="eTrack">'+tr+'</div></div>'+
    '<div class="f"><label>星期几</label><div class="days" id="eDays">'+days+'</div></div>'+
    '<div class="f"><label>时间</label><div class="two">'+
      '<input type="time" id="eStart" value="'+editing.start+'">'+
      '<input type="time" id="eEnd" value="'+editing.end+'"></div></div>'+
    '<div class="f"><label>备注（可空）</label><input id="eNote" value="'+esc(editing.note||'')+'"></div>'+
    '<button class="btn primary" id="eSave">保存</button>'+
    (b?'<button class="btn danger" id="eDel">删掉这一节</button>':'')+
    '<button class="btn" id="eCancel">取消</button>';
  document.getElementById('sheet').classList.add('on');

  box.querySelectorAll('#eDays button').forEach(function(el){
    el.onclick=function(){
      var n=+el.getAttribute('data-day');
      var i=editing.days.indexOf(n);
      if(i>=0) editing.days.splice(i,1); else editing.days.push(n);
      el.classList.toggle('on');
    };
  });
  box.querySelectorAll('#eTrack button').forEach(function(el){
    el.onclick=function(){
      editing.track=el.getAttribute('data-tr');
      box.querySelectorAll('#eTrack button').forEach(function(x){
        x.className=''; x.style.background=''; x.style.borderColor='';
      });
      el.className='on';
      el.style.background=TRACK[editing.track].color;
      el.style.borderColor=TRACK[editing.track].color;
    };
  });
  document.getElementById('eSave').onclick=function(){
    var t=document.getElementById('eTitle').value.trim();
    if(!t){ toast('标题不能空'); return; }
    if(!editing.days.length){ toast('至少选一天'); return; }
    var st=document.getElementById('eStart').value, en=document.getElementById('eEnd').value;
    if(toMin(en)<=toMin(st)){ toast('结束要晚于开始'); return; }
    editing.title=t;
    editing.start=st; editing.end=en;
    editing.note=document.getElementById('eNote').value.trim();
    editing.days.sort();
    if(b){
      for(var i=0;i<S.blocks.length;i++) if(S.blocks[i].id===b.id) S.blocks[i]=editing;
    }else{
      editing.id=uid(); S.blocks.push(editing);
    }
    save(); closeSheet(); render(); toast('已保存');
  };
  var del=document.getElementById('eDel');
  if(del) del.onclick=function(){
    if(!confirm('删掉「'+b.title+'」？')) return;
    S.blocks=S.blocks.filter(function(x){ return x.id!==b.id; });
    save(); closeSheet(); render();
  };
  document.getElementById('eCancel').onclick=closeSheet;
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('sheetBox').innerHTML='';
}
document.getElementById('sheet').onclick=function(e){
  if(e.target.id==='sheet') closeSheet();
};

/* ---------- 提醒 ---------- */
var fired=loadFired();
function loadFired(){
  try{
    var o=JSON.parse(localStorage.getItem('kebiao.fired')||'{}');
    if(o.date!==iso()) return {};
    return o.map||{};
  }catch(e){ return {}; }
}
function saveFired(){
  try{ localStorage.setItem('kebiao.fired', JSON.stringify({date:iso(),map:fired})); }catch(e){}
}
function checkAlarm(){
  if(!S.settings.notify) return;
  var now=new Date(), iso0=iso(now), n=nowMin();
  blocksOn(now).forEach(function(b){
    var st=toMin(b.start), k=iso0+'|'+b.id+'|'+b.start;
    if(n>=st && n-st<=30 && !fired[k]){
      fired[k]=1; saveFired();
      fire(b);
    }
  });
}
var lastFire=0;
function fire(b){
  var t=new Date();
  if(t.getTime()-lastFire<2000) return;
  lastFire=t.getTime();
  toast('该做「'+b.title+'」了（'+b.start+'–'+b.end+'）',4000);
  ring();
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
  if(typeof Notification!=='undefined' && Notification.permission==='granted'){
    try{
      var nn=new Notification('该做「'+b.title+'」了',{
        body:b.start+'–'+b.end+(b.note?('　'+b.note):''),
        tag:'kb-'+b.id, icon:'icon-192.png', requireInteraction:false
      });
      nn.onclick=function(){ window.focus(); nn.close(); };
    }catch(e){}
  }
}
var ac=null;
function beep(){
  if(!S.settings.sound) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16);
    o.start(); o.stop(ac.currentTime+.18);
  }catch(e){}
}
function ring(){ beep(); setTimeout(beep,260); setTimeout(beep,520); }

/* ---------- 导出 ---------- */
function download(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
function esc4(s){ return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function downloadICS(){
  download(new Blob([icsText()],{type:'text/calendar;charset=utf-8'}),'三线课表.ics');
  toast('已导出，下一步导入手机日历');
}
function icsText(){
  var BY=['MO','TU','WE','TH','FR','SA','SU'];
  var d0=new Date(); d0.setHours(0,0,0,0);
  var out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//sanxian-kebiao//CN','CALSCALE:GREGORIAN'];
  S.blocks.forEach(function(b){
    var first=null;
    for(var i=0;i<8;i++){
      var d=new Date(d0); d.setDate(d.getDate()+i);
      if(b.days.indexOf(dow(d))>=0){ first=d; break; }
    }
    if(!first) return;
    var ymd=first.getFullYear()+pad(first.getMonth()+1)+pad(first.getDate());
    var st=toMin(b.start), en=toMin(b.end);
    var ds=ymd+'T'+pad(Math.floor(st/60))+pad(st%60)+'00';
    var de=ymd+'T'+pad(Math.floor(en/60))+pad(en%60)+'00';
    out.push('BEGIN:VEVENT');
    out.push('UID:'+b.id+'@sanxian');
    out.push('DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z');
    out.push('DTSTART:'+ds);
    out.push('DTEND:'+de);
    out.push('RRULE:FREQ=WEEKLY;BYDAY='+b.days.map(function(x){ return BY[x-1]; }).join(',')+';UNTIL=20271231T235959');
    out.push('SUMMARY:'+esc4(b.title));
    if(b.note) out.push('DESCRIPTION:'+esc4(b.note));
    out.push('BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:'+esc4(b.title),'END:VALARM');
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');
  return out.join('\r\n');
}

/* ---------- 杂项 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
}); }
var tT=null;
function toast(msg,ms){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(tT); tT=setTimeout(function(){ t.classList.remove('on'); },ms||2000);
}

/* ---------- 启动 ---------- */
document.getElementById('tabs').addEventListener('click',function(e){
  var el=e.target.closest('[data-v]'); if(!el) return;
  document.querySelectorAll('#tabs div').forEach(function(x){ x.classList.remove('on'); });
  el.classList.add('on');
  view=el.getAttribute('data-v');
  render();
});
window.addEventListener('scroll',function(){ currentScroll=window.scrollY; },{passive:true});
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ checkAlarm(); render(); } });
setInterval(checkAlarm,15000);
setTimeout(checkAlarm,1200);

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* 调试钩子（控制台可用，不影响使用） */
window.__kb={ get view(){ return view; }, set view(v){ view=v; render(); },
  ics:icsText, get data(){ return S; } };

render();
})();
</script>
